# Leadsheet and its Postgres. Put POSTGRES_PASSWORD (and optionally
# LEADSHEET_OAUTH_CLIENT_KEY) in env/leadsheet.env and run `just up`, which
# passes it for the ${...} values below. The app listens on :8120; put HTTPS
# in front of it (a reverse proxy, a Cloudflare Tunnel, ...).
name: leadsheet

services:
  leadsheet:
    build:
      context: ..
      dockerfile: build/Dockerfile
      args:
        - GIT_COMMIT=${GIT_COMMIT:-unknown}
        - BUILD_TIME=${BUILD_TIME:-unknown}
    image: leadsheet
    container_name: leadsheet
    restart: unless-stopped
    environment:
      LEADSHEET_PUBLIC_URL: ${LEADSHEET_PUBLIC_URL:-https://leadsheet.fm}
      LEADSHEET_DATABASE_URL: postgres://leadsheet:${POSTGRES_PASSWORD:?set in env/leadsheet.env}@postgres:5432/leadsheet?sslmode=disable
      # Confidential OAuth client key (multibase P-256, from `leadsheet gen-client-key`).
      LEADSHEET_OAUTH_CLIENT_KEY: ${LEADSHEET_OAUTH_CLIENT_KEY:-}
      LEADSHEET_METRICS_LISTEN_ADDRESS: 0.0.0.0:8122
      # Traces go to this OTLP/HTTP collector when set.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8120:8120"
      # Prometheus metrics and pprof, for the host's Alloy only.
      - "127.0.0.1:8122:8122"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: leadsheet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadsheet
      POSTGRES_DB: leadsheet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in env/leadsheet.env}
    volumes:
      - leadsheet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "leadsheet", "-d", "leadsheet"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  leadsheet-pgdata:
